Match User mnhpull
    ChrootDirectory /srv/mnh-backups
    ForceCommand internal-sftp -R -d /archives
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitTTY no
    X11Forwarding no
