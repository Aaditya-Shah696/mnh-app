# Install: sudo cp deploy/fail2ban/jail.d/mnh.conf /etc/fail2ban/jail.d/
#          sudo cp deploy/fail2ban/filter.d/caddy-login.conf /etc/fail2ban/filter.d/
#          sudo systemctl restart fail2ban
[DEFAULT]
banaction = ufw

[sshd]
enabled = true
maxretry = 5
findtime = 10m
bantime = 1h

[caddy-login]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = caddy-login
maxretry = 20
findtime = 10m
bantime  = 1h
