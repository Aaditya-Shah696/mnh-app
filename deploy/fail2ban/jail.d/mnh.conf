# Install: sudo cp deploy/fail2ban/jail.d/mnh.conf /etc/fail2ban/jail.d/
#          sudo cp deploy/fail2ban/filter.d/mnh-login.conf /etc/fail2ban/filter.d/
#          sudo systemctl restart fail2ban
[DEFAULT]
banaction = ufw

[sshd]
enabled = true
backend = systemd
maxretry = 5
findtime = 10m
bantime = 1h

[mnh-login]
enabled  = true
backend  = systemd
port     = http,https
filter   = mnh-login
maxretry = 20
findtime = 10m
bantime  = 1h
