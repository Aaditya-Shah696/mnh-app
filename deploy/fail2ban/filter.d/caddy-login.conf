# Matches Caddy JSON access-log lines for failed or throttled logins.
# Caddy writes one JSON object per line; the fields used are
# "request":{"remote_ip":"1.2.3.4",...,"uri":"/api/auth/login"} and "status":401.
[Definition]
failregex = ^.*"request":\{.*"remote_ip":"<HOST>".*"uri":"/api/auth/login".*"status":(401|429).*$
ignoreregex =
datepattern = "ts":{EPOCH}
