# CI/CD for MNH Discharge Records.
#
# Every push and pull request: install the hashed lock, run pip-audit, run
# the full test suite against the REAL embedding model (cached between runs).
#
# Push to main, tests green: fast-forward the `production` branch to the
# same commit. The VPS polls `production` every minute (deploy/mnh-autodeploy.timer)
# and runs scripts/deploy.sh when it moves. The last job then waits until
# https://mnhapp.org/api/health reports this commit, so a green check on
# main means "deployed and healthy", and a red one means "look at the VPS".
#
# No deploy secrets: the VPS has no public SSH, and the only credential used
# here is the workflow's own GITHUB_TOKEN (to push the production branch).

name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  PUBLIC_URL: https://mnhapp.org

jobs:
  test:
    name: Test (real embedding model)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies (hash-checked)
        run: python -m pip install -r requirements.lock --require-hashes

      - name: Vulnerability audit
        run: pip-audit -r requirements.lock --require-hashes --progress-spinner off

      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}

      - name: Run tests
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          # GitHub does not expand ~ or $HOME inside env:, so set it here.
          export FASTEMBED_CACHE_PATH="$HOME/.cache/fastembed"
          mkdir -p "$FASTEMBED_CACHE_PATH"
          python -m pytest tests -q --no-header -p no:cacheprovider

  promote:
    name: Promote main to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      skipped: ${{ steps.promote.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fast-forward production to this commit
        id: promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Re-running an old workflow run must not roll production back:
          # if production already contains this commit there is nothing to do.
          if git fetch --quiet origin production 2>/dev/null \
             && git merge-base --is-ancestor "${GITHUB_SHA}" origin/production; then
            echo "production is already at or past ${GITHUB_SHA} ($(git rev-parse --short origin/production)); nothing to promote"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fast-forward only: production must always be an ancestor-chain of main.
          # If main was rewritten, this fails loudly instead of silently rolling back.
          git push origin "${GITHUB_SHA}:refs/heads/production"
          echo "production -> ${GITHUB_SHA}"

  verify-deploy:
    name: Verify the VPS is running this commit
    needs: promote
    # Skipped when promote found production already past this commit (a
    # re-run of an old workflow run); verifying an old SHA would just fail.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.promote.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Poll /api/health until version == ${{ github.sha }}
        run: |
          want="${GITHUB_SHA}"
          host="${PUBLIC_URL#https://}"
          # Until the VPS is built and the DNS A record exists there is nothing
          # to verify. A hostname that does not resolve is "not provisioned yet",
          # reported as a warning, not a failed build. Once it resolves, a
          # missing or stale version IS a failed deploy.
          if ! getent hosts "$host" >/dev/null; then
            echo "::warning::${host} does not resolve yet (VPS not provisioned or DNS A record missing). Promotion to production succeeded; deployment will happen once the server exists."
            exit 0
          fi
          deadline=$((SECONDS + 600))   # autodeploy polls every 60 s; deploy takes ~2 min
          while [ $SECONDS -lt $deadline ]; do
            body=$(curl -fsS --max-time 15 "${PUBLIC_URL}/api/health" || true)
            have=$(printf '%s' "$body" | sed -n 's/.*"version":"\([0-9a-f]*\)".*/\1/p')
            if [ "$have" = "$want" ]; then
              echo "Deployed: ${PUBLIC_URL} is running ${want}"
              exit 0
            fi
            echo "$(date -u +%H:%M:%S) live=${have:-unreachable} want=${want}; waiting"
            sleep 20
          done
          echo "::error::${PUBLIC_URL} never reported ${want}. Check on the VPS: journalctl -u mnh-autodeploy -n 100"
          exit 1
